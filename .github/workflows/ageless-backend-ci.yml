name: AgeLess Backend CI

on:
  push:
    branches:
      - back/admin-owner-legal-evidence
      - beta/highgloss-logo
  pull_request:
    branches:
      - beta/highgloss-logo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Backoffice security tests
        run: node scripts/backoffice-test.cjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          AGELESS_CHECKOUT_ENABLED: 'false'
        run: npm run build
