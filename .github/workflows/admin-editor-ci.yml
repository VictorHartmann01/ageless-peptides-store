name: AgeLess Admin Editor Build
on:
  pull_request:
    paths:
      - 'app/admin/**'
      - 'app/globals.css'
      - 'app/api/admin/image-upload/**'
      - '.github/workflows/admin-editor-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
