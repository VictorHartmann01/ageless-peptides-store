name: AgeLess Admin Editor Build
on:
  pull_request:
    paths:
      - 'app/admin/**'
      - 'app/globals.css'
      - 'app/api/admin/image-upload/**'
      - 'app/api/admin/route.ts'
      - 'lib/commerce/**'
      - 'proxy.ts'
      - 'scripts/*test*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-editor-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node scripts/backoffice-test.cjs
      - run: node scripts/access-test.cjs
      - run: node scripts/image-upload-test.cjs
      - run: node scripts/admin-editor-test.cjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder

