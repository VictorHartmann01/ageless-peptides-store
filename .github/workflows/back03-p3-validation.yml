name: Back03 P3 validation
on:
  pull_request:
    paths:
      - 'app/login/**'
      - 'app/api/admin/**'
      - 'tests/**'
      - 'lib/commerce/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/back03-p3-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'build-placeholder'
